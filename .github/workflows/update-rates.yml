# Updates rates.json a few times a day and publishes it with GitHub Pages. Free for public repos.
name: update-rates

on:
  schedule:
    - cron: "45 0 * * *"   # 06:15 IST — new USD rate
    - cron: "30 7 * * *"   # 13:00 IST — IBJA morning rate
    - cron: "45 12 * * *"  # 18:15 IST — IBJA evening rate
  workflow_dispatch: {}     # "Run workflow" button for a manual update

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update_rates.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet -- rates.json; then
            git config user.name "rates-bot"
            git config user.email "rates-bot@users.noreply.github.com"
            git add rates.json
            git commit -m "rates $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
